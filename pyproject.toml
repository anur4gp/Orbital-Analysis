[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbital-analysis"
version = "0.2.0"
description = "Flight dynamics, estimation, and surrogate-accelerated conjunction assessment"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Anurag Paudel" }]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "sgp4>=2.24",
    "requests>=2.32",
]

[project.optional-dependencies]
# Only the triage classifier needs scikit-learn; only the campaign runner
# needs pandas/pyarrow. Keeping them optional holds the core install lean.
triage = ["scikit-learn>=1.5"]
campaign = ["pandas>=2.2", "pyarrow>=16"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: takes more than a few seconds",
    "network: requires live CelesTrak or Space-Track access",
]

[tool.ruff]
line-length = 96
src = ["src", "scripts", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The reference C++ wrapper and its vendored test are kept verbatim.
"reference/*" = ["ALL"]

[tool.mypy]
python_version = "3.12"
files = ["src/orbital"]
ignore_missing_imports = true
warn_unused_ignores = true
