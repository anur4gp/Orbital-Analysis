name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,triage,campaign]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      # Offline suite; the coverage floor sits just under the measured value.
      - name: Test
        run: >
          pytest -q --cov=orbital --cov-report=term-missing
          --cov-fail-under=93

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build campaign image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: orbital-campaign:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the entrypoint
        run: |
          docker run --rm orbital-campaign:ci --help
          mkdir -p out
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/out:/data" \
            orbital-campaign:ci \
            --points 16 --trials 2 --revolutions 0.3 --workers 1 --out /data/ci
          test -f out/ci/runs.parquet && test -f out/ci/config.json
