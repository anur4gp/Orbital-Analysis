name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,triage]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      # The suite is offline by design: no CelesTrak or Space-Track access is
      # needed, so CI never depends on a third-party service being up.
      - name: Test
        run: pytest -q --cov=orbital --cov-report=term-missing
